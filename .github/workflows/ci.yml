name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  dotnet-check:
    name: .NET C# Core Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore godot/Lwsmf.csproj

      - name: Build C# Core Assembly (Debug)
        run: dotnet build godot/Lwsmf.csproj -c Debug --no-restore -warnaserror

      - name: Build C# Core Assembly (Release)
        run: dotnet build godot/Lwsmf.csproj -c Release --no-restore -warnaserror

      - name: Build C# Core Assembly (ExportRelease)
        run: dotnet build godot/Lwsmf.csproj -c ExportRelease --no-restore -warnaserror

      - name: Restore dependencies (Android net9.0)
        run: dotnet restore godot/Lwsmf.csproj -p:GodotTargetPlatform=android

      - name: Build C# Core Assembly (Android ExportRelease)
        run: dotnet build godot/Lwsmf.csproj -c ExportRelease -p:GodotTargetPlatform=android --no-restore -warnaserror

      - name: Lint Decisions & Docs Links
        run: python tools/lint_decisions.py

      - name: Repo Privacy Audit
        run: python tools/release_audit.py --repo-scan

      - name: Mobile Tools Compile Check
        run: python -m compileall -q tools

      - name: Mobile Tools CLI Smoke
        run: python tools/mobile/windows_pe.py --help

      - name: Install Python Tool Dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Mobile Packaging Tools Unit Tests
        run: python tools/mobile/test_mobile_tools.py

      - name: HD Pipeline Tools Unit Tests
        run: python tools/test_hd_tools.py

      - name: Release Script Syntax Check
        shell: bash
        run: for f in tools/*.sh; do bash -n "$f"; done

  rust-check:
    name: Rust Workspace Check & Oracle Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Offline Unit Tests
        run: cargo test --workspace --lib --no-fail-fast

      - name: Tileset Offline Integration Tests
        run: cargo test -p wolf-format --test tileset
