name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  dotnet-check:
    name: .NET C# Core Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore godot/Lwsmf.csproj

      - name: Build C# Core Assembly (Debug)
        run: dotnet build godot/Lwsmf.csproj -c Debug --no-restore

      - name: Build C# Core Assembly (Release)
        run: dotnet build godot/Lwsmf.csproj -c Release --no-restore

      - name: Build C# Core Assembly (ExportRelease)
        run: dotnet build godot/Lwsmf.csproj -c ExportRelease --no-restore

      - name: Lint Decisions & Docs Links
        run: python tools/lint_decisions.py

      - name: Repo Privacy Audit
        run: python tools/release_audit.py --repo-scan

      - name: Mobile Tools Compile Check
        run: python -m py_compile tools/mobile/windows_pe.py tools/mobile/android_data.py tools/mobile/env_check.py tools/mobile/export_preset_template.py tools/mobile/ios_inject_data.py tools/mobile/postprocess_android_apk.py tools/mobile/strip_android_static_libs.py tools/mobile/test_mobile_tools.py tools/audit_cross_platform_assets.py tools/brotli_json.py tools/pack_media.py tools/sync_boot_assets.py tools/sync_release_icons.py tools/templates/custom_2d_mono.py tools/templates/build_custom_template.py tools/verify_hd_manifest.py tools/upscale_assets.py tools/release_audit.py tools/lint_decisions.py

      - name: Mobile Tools CLI Smoke
        run: python tools/mobile/windows_pe.py --help

      - name: Mobile Packaging Tools Unit Tests
        run: python tools/mobile/test_mobile_tools.py

      - name: Install HD Tool Dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: HD Pipeline Tools Unit Tests
        run: python tools/test_hd_tools.py

      - name: Release Script Syntax Check
        shell: bash
        run: bash -n tools/package_release.sh tools/package_android.sh tools/package_ios.sh tools/godot_check.sh tools/godot_smoke.sh tools/check_oracle.sh

  rust-check:
    name: Rust Workspace Check & Oracle Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Offline Unit Tests
        run: cargo test --workspace --lib --no-fail-fast

      - name: Tileset Offline Integration Tests
        run: cargo test -p wolf-format --test tileset
