name: Custom 2D GLES3 Mono Export Templates

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (all, windows, android, ios)'
        required: false
        default: 'all'
  push:
    branches: [ master, main ]
    paths:
      - 'tools/templates/**'
      - '.github/workflows/custom-templates.yml'

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-windows:
    name: Build Windows x86_64 2D/GLES3+Mono Template
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore custom template cache
        id: tpl-cache
        uses: actions/cache@v5
        with:
          path: |
            dist/templates/windows
            godot-src/bin
          key: custom-tpl-${{ env.GODOT_RELEASE }}-windows-${{ hashFiles('tools/templates/**') }}
          restore-keys: |
            custom-tpl-${{ env.GODOT_RELEASE }}-windows-

      - name: Checkout Godot 4.7.2-stable source
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_RELEASE }}
          path: godot-src
          fetch-depth: 1

      - name: Build Windows 2D/GLES3+Mono release template
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          python tools/templates/build_custom_template.py `
            --platform windows `
            --godot-src godot-src `
            --out dist/templates/windows

      - name: Download Godot 4.7.2 Mono editor & base templates for export smoke test
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$RUNNER_TEMP/godot-win"
          mkdir -p "$TOOLS_DIR"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -L --fail --retry 3 -o "$TOOLS_DIR/godot.zip" "${BASE_URL}/Godot_v${GODOT_RELEASE}_mono_win64.zip"
          unzip -q "$TOOLS_DIR/godot.zip" -d "$TOOLS_DIR/editor"
          GODOT_BIN="$(find "$TOOLS_DIR/editor" -name '*console.exe' | head -n1)"
          curl -L --fail --retry 3 -o "$TOOLS_DIR/tpl.tpz" "${BASE_URL}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q "$TOOLS_DIR/tpl.tpz" -d "$TOOLS_DIR/tpl"
          TPL_DIR="$APPDATA/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TPL_DIR"
          cp -R "$TOOLS_DIR/tpl/templates/." "$TPL_DIR/"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Smoke-export Windows Desktop with custom template
        shell: bash
        run: |
          set -euo pipefail
          cp godot/export_presets.cfg "$RUNNER_TEMP/export_presets.bak"
          trap 'cp -f "$RUNNER_TEMP/export_presets.bak" godot/export_presets.cfg' EXIT
          python tools/mobile/export_preset_template.py \
            --preset-file godot/export_presets.cfg \
            --preset "Windows Desktop" \
            --set "custom_template/release=$(pwd)/dist/templates/windows/windows_release_x86_64.exe"
          dotnet build godot/Lwsmf.csproj -c ExportRelease
          "$GODOT_BIN" --headless --path godot --import --quit || true
          mkdir -p godot/build/release
          "$GODOT_BIN" --headless --path godot --export-release "Windows Desktop"
          test -f godot/build/release/Lwsmf.exe
          godot/build/release/Lwsmf.exe --headless --quit || true

      - name: Upload Windows custom template
        uses: actions/upload-artifact@v4
        with:
          name: lwsmf-custom-template-windows-x86_64
          path: dist/templates/windows/windows_release_x86_64.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android arm64 2D/GLES3+Mono Template
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK r28b
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 28.1.13356709
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.1.13356709" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Restore custom template cache
        id: tpl-cache
        uses: actions/cache@v5
        with:
          path: |
            dist/templates/android
          key: custom-tpl-${{ env.GODOT_RELEASE }}-android-${{ hashFiles('tools/templates/**') }}
          restore-keys: |
            custom-tpl-${{ env.GODOT_RELEASE }}-android-

      - name: Checkout Godot 4.7.2-stable source
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_RELEASE }}
          path: godot-src
          fetch-depth: 1

      - name: Build Android arm64 2D/GLES3+Mono release template
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/templates/build_custom_template.py \
            --platform android \
            --godot-src godot-src \
            --out dist/templates/android

      - name: Upload Android custom template
        uses: actions/upload-artifact@v4
        with:
          name: lwsmf-custom-template-android-arm64
          path: dist/templates/android/android_release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS arm64 2D/GLES3+Mono Template
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons

      - name: Setup .NET 8 SDK and iOS workload
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Restore custom template cache
        id: tpl-cache
        uses: actions/cache@v5
        with:
          path: |
            dist/templates/ios
          key: custom-tpl-${{ env.GODOT_RELEASE }}-ios-${{ hashFiles('tools/templates/**') }}
          restore-keys: |
            custom-tpl-${{ env.GODOT_RELEASE }}-ios-

      - name: Download official Godot 4.7.2 Mono editor & base ios.zip
        run: |
          set -euo pipefail
          TOOLS_DIR="$RUNNER_TEMP/godot-ios"
          mkdir -p "$TOOLS_DIR/bin"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -L --fail --retry 3 -o "$TOOLS_DIR/godot-mono.zip" "${BASE_URL}/Godot_v${GODOT_RELEASE}_mono_macos.universal.zip"
          unzip -q "$TOOLS_DIR/godot-mono.zip" -d "$TOOLS_DIR/editor"
          GODOT_BIN="$TOOLS_DIR/editor/Godot_mono.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -o "$TOOLS_DIR/tpl.tpz" "${BASE_URL}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q "$TOOLS_DIR/tpl.tpz" -d "$TOOLS_DIR/tpl"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TPL_DIR"
          cp -R "$TOOLS_DIR/tpl/templates/." "$TPL_DIR/"
          echo "BASE_IOS_ZIP=$TPL_DIR/ios.zip" >> "$GITHUB_ENV"

      - name: Checkout Godot 4.7.2-stable source
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_RELEASE }}
          path: godot-src
          fetch-depth: 1

      - name: Build iOS arm64 2D/GLES3+Mono release template
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/templates/build_custom_template.py \
            --platform ios \
            --godot-src godot-src \
            --base-ios-zip "$BASE_IOS_ZIP" \
            --out dist/templates/ios

      - name: Smoke-build unsigned iOS IPA with custom template
        run: |
          bash tools/package_ios.sh \
            --version "0.1.0-custom" \
            --template "$(pwd)/dist/templates/ios/ios.zip" \
            --unsigned \
            --force

      - name: Upload iOS custom template
        uses: actions/upload-artifact@v4
        with:
          name: lwsmf-custom-template-ios-arm64
          path: dist/templates/ios/ios.zip
          if-no-files-found: error
          retention-days: 30
